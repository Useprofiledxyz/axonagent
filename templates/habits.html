<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaks — habit tracker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0916; color: #eeeefc; font-family: system-ui, sans-serif; padding: 22px; }
  .top { display: flex; justify-content: space-between; align-items: end; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 24px; } h1 span { color: #7cf7ff; }
  .streak { text-align: right; } .streak b { display: block; font-size: 34px; background: linear-gradient(90deg, #7cf7ff, #ff4fd8); -webkit-background-clip: text; background-clip: text; color: transparent; } .streak small { color: #8f8bab; }
  .grid { display: grid; grid-template-columns: 1.6fr repeat(7, 1fr); gap: 6px; align-items: center; }
  .grid .h { font-size: 11px; color: #8f8bab; text-align: center; letter-spacing: .1em; }
  .name { font-size: 14px; padding: 8px 0; }
  .cell { aspect-ratio: 1; border-radius: 9px; border: 1px solid #2d2748; background: #120f22; cursor: pointer; transition: transform .15s, background .2s; }
  .cell:hover { transform: scale(1.06); }
  .cell.on { background: linear-gradient(135deg, #7cf7ff, #8b6cff 60%, #ff4fd8); border-color: transparent; box-shadow: 0 0 16px rgba(139,108,255,.45); }
  .bar { margin-top: 18px; height: 10px; border-radius: 99px; background: #1e1a33; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7cf7ff, #ff4fd8); transition: width .4s; }
  .foot { display: flex; justify-content: space-between; color: #8f8bab; font-size: 12px; margin-top: 8px; }
  form { display: flex; gap: 8px; margin-top: 16px; } input { flex: 1; background: #120f22; border: 1px solid #2d2748; border-radius: 10px; color: #fff; padding: 10px; font: inherit; }
  button { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; background: linear-gradient(90deg, #7cf7ff, #ff4fd8); color: #05030d; cursor: pointer; }
</style>
</head>
<body>
  <div class="top"><h1>Streaks<span>.</span></h1><div class="streak"><b id="streak">0</b><small>day streak</small></div></div>
  <div class="grid" id="grid"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="foot"><span id="pct">0% this week</span><span>tap a square to check it off</span></div>
  <form id="add"><input id="name" placeholder="Add a habit…" maxlength="24"><button>Add</button></form>
<script>
  const days = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
  let data = JSON.parse(localStorage.getItem("streaks") || "null") || {
    habits: ["Drink water", "Walk 8k steps", "Read 20 min", "Ship one thing", "Sleep by 23:00"],
    done: { "0-0": 1, "0-1": 1, "0-2": 1, "0-3": 1, "1-0": 1, "1-1": 1, "1-3": 1, "2-0": 1, "2-2": 1, "2-3": 1, "3-0": 1, "3-1": 1, "3-2": 1, "3-3": 1, "4-1": 1, "4-3": 1 },
  };
  const save = () => localStorage.setItem("streaks", JSON.stringify(data));
  function render() {
    const g = document.getElementById("grid");
    g.innerHTML = "<div></div>" + days.map((d) => `<div class="h">${d}</div>`).join("");
    data.habits.forEach((h, i) => {
      g.insertAdjacentHTML("beforeend", `<div class="name">${h.replace(/</g, "&lt;")}</div>` +
        days.map((_, d) => `<div class="cell ${data.done[i + "-" + d] ? "on" : ""}" data-k="${i}-${d}"></div>`).join(""));
    });
    const total = data.habits.length * 7, n = Object.keys(data.done).length;
    const pct = total ? Math.round((n / total) * 100) : 0;
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "% this week";
    let s = 0; for (let d = 0; d < 7; d++) { if (data.habits.some((_, i) => data.done[i + "-" + d])) s++; else break; }
    document.getElementById("streak").textContent = s;
  }
  document.getElementById("grid").onclick = (e) => {
    const k = e.target.dataset.k; if (!k) return;
    if (data.done[k]) delete data.done[k]; else data.done[k] = 1;
    save(); render();
  };
  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault(); const v = document.getElementById("name").value.trim();
    if (v) { data.habits.push(v); document.getElementById("name").value = ""; save(); render(); }
  };
  render();
</script>
</body>
</html>
