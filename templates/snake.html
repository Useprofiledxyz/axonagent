<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake</title>
<style>
  :root { --a: #7cf7ff; --b: #ff4fd8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #1d1240, #05040a); color: #eeeefc; font-family: system-ui, sans-serif; }
  .wrap { text-align: center; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .2em; background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud { display: flex; justify-content: center; gap: 18px; font: 600 13px ui-monospace, monospace; color: #b9a8ff; margin-bottom: 10px; }
  canvas { width: min(86vmin, 420px); aspect-ratio: 1; border-radius: 14px; background: #0b0916; box-shadow: 0 0 0 1px #2d2748, 0 20px 60px rgba(139,108,255,.25); }
  p { color: #8f8bab; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NEON SNAKE</h1>
  <div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
  <canvas id="c" width="420" height="420"></canvas>
  <p>Arrow keys or swipe · Space to restart</p>
</div>
<script>
  const c = document.getElementById("c"), x = c.getContext("2d"), N = 21, S = c.width / N;
  let snake, dir, next, food, score, best = +(localStorage.getItem("snake-best") || 0), dead, last = 0, auto = true;
  document.getElementById("best").textContent = best;
  function reset() { snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; dir = next = { x: 1, y: 0 }; score = 0; dead = false; place(); upd(); }
  function place() { do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (snake.some((s) => s.x === food.x && s.y === food.y)); }
  function upd() { document.getElementById("score").textContent = score; }
  function steer() { // demo mode: chase the food until the player presses a key
    const h = snake[0], opts = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }].filter((d) => !(d.x === -dir.x && d.y === -dir.y));
    const safe = opts.filter((d) => { const n = { x: (h.x + d.x + N) % N, y: (h.y + d.y + N) % N }; return !snake.some((s) => s.x === n.x && s.y === n.y); });
    (safe.length ? safe : opts).sort((a, b) => Math.hypot(h.x + a.x - food.x, h.y + a.y - food.y) - Math.hypot(h.x + b.x - food.x, h.y + b.y - food.y));
    next = (safe.length ? safe : opts)[0];
  }
  function tick() {
    if (dead) return;
    if (auto) steer();
    dir = next;
    const h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
    if (snake.some((s) => s.x === h.x && s.y === h.y)) { dead = true; if (auto) setTimeout(reset, 900); return; }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; if (!auto && score > best) { best = score; localStorage.setItem("snake-best", best); document.getElementById("best").textContent = best; } place(); upd(); } else snake.pop();
  }
  function draw(t) {
    x.fillStyle = "#0b0916"; x.fillRect(0, 0, c.width, c.height);
    x.strokeStyle = "rgba(139,108,255,.08)";
    for (let i = 0; i <= N; i++) { x.beginPath(); x.moveTo(i * S, 0); x.lineTo(i * S, c.height); x.moveTo(0, i * S); x.lineTo(c.width, i * S); x.stroke(); }
    x.shadowBlur = 18; x.shadowColor = "#ff4fd8"; x.fillStyle = "#ff4fd8";
    const r = S * (0.32 + 0.06 * Math.sin(t / 200));
    x.beginPath(); x.arc(food.x * S + S / 2, food.y * S + S / 2, r, 0, 7); x.fill();
    snake.forEach((s, i) => {
      const k = i / snake.length;
      x.shadowColor = x.fillStyle = `hsl(${185 + k * 90}, 100%, ${70 - k * 15}%)`;
      x.fillRect(s.x * S + 2, s.y * S + 2, S - 4, S - 4);
    });
    x.shadowBlur = 0;
    if (dead && !auto) { x.fillStyle = "rgba(5,4,10,.7)"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#fff"; x.font = "bold 22px system-ui"; x.textAlign = "center"; x.fillText("GAME OVER · SPACE", c.width / 2, c.height / 2); }
  }
  function loop(t) { if (t - last > 95) { tick(); last = t; } draw(t); requestAnimationFrame(loop); }
  const keys = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { auto = false; reset(); return; }
    const d = keys[e.key]; if (!d) return; e.preventDefault();
    if (auto) { auto = false; reset(); }
    if (d.x !== -dir.x || d.y !== -dir.y) next = d;
  });
  let sx, sy;
  addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (auto) { auto = false; reset(); }
    const d = Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
    if (d.x !== -dir.x || d.y !== -dir.y) next = d;
  });
  reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
